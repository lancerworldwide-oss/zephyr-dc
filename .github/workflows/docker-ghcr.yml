# Build and push the Zephyr dev container to GHCR.
#
# Org setup: allow GITHUB_TOKEN to write packages (repo Settings → Actions →
# General → Workflow permissions, or matching org policy).
name: Build and push Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: lancerworldwide-oss
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/lancerworldwide-oss/zephyr-dc:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
