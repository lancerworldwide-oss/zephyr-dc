[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zephyr-dc-mcp"
version = "0.1.0"
description = "Zephyr firmware MCP server with OpenAI agent for the zephyr-dc container"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
zephyr-dc-mcp = "zephyr_dc_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zephyr_dc_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
